name: Validate

on:
  push:
  pull_request:

jobs:
  demo-workspace:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject tracked private data
        shell: bash
        run: |
          tracked="$(git ls-files -- private .env '.env.*' ':(glob)**/.env' ':(glob)**/.env.*')"
          if [[ -n "$tracked" ]]; then
            echo "Private runtime data must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check skill without UI dependencies
        run: python -S -m unittest discover -s tests -p 'test_skill_workflow.py' -v

      - name: Validate demo workspace
        run: python -S scripts/validate_workspace.py --data-dir demo --read-only

      - name: Install optional UI dependencies
        run: python -m pip install -r requirements-ui.txt

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check UI layouts
        run: node --test tests/ui_layouts.test.cjs

      - name: Check Flask app routes
        run: PYTHONPATH=app python -m flask --app server routes
